name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo +stable fmt --check
      - name: Lint
        run: cargo +stable clippy --all-targets -- -D warnings
      - name: Test
        run: cargo +stable test --all-targets
      - name: Build release binary
        run: cargo +stable build --release

  msrv:
    name: Rust 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check minimum supported Rust version
        run: cargo +1.85.0 check --all-targets

  packaging:
    name: Packaging metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test package metadata tools
        run: |
          ruby scripts/tests/render-homebrew-formula_test.rb
          ruby scripts/tests/validate-winget-manifests_test.rb
